<app-navbar>
  <ion-header>
    <ion-toolbar>
      <ion-title>Signup</ion-title>
    </ion-toolbar>
  </ion-header>
</app-navbar>

<ion-content>
  <div class="signup-container">
    <form (submit)="signup()">
      <ion-item>
        <ion-label position="floating">Username</ion-label>
        <ion-input 
          type="text" 
          placeholder="Enter your username" 
          [(ngModel)]="username" 
          name="username">
        </ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="floating">First Name</ion-label>
        <ion-input 
          type="text" 
          placeholder="Enter your first name" 
          [(ngModel)]="firstName" 
          name="firstName">
        </ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="floating">Last Name</ion-label>
        <ion-input 
          type="text" 
          placeholder="Enter your last name" 
          [(ngModel)]="lastName" 
          name="lastName">
        </ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="floating">Email</ion-label>
        <ion-input 
          type="email" 
          placeholder="Enter your email" 
          [(ngModel)]="email" 
          name="email">
        </ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="floating">Password</ion-label>
        <ion-input 
          type="password" 
          placeholder="Enter your password" 
          [(ngModel)]="password" 
          name="password">
        </ion-input>
      </ion-item>
      <ion-button expand="full" type="submit">Signup</ion-button>
    </form>
  </div>
</ion-content>
