<app-navbar></app-navbar>

<ion-content>
  <!-- Hero Section -->
  <div class="hero-section" style="background-image: url('assets/neon.jpg');">
    <h1>Discover Your Next Favorite Game</h1>
    <p>Explore, collect, and track achievements of thousands of games</p>
  </div>

  <div class="main-content">
    <div class="sidebar">
      <input type="text" [(ngModel)]="filters.search" placeholder="Search games..." class="form-control search-input" />

      <div class="filter-group">
        <h4>Genres</h4>
        <button
          (click)="setFilter('genres', '')"
          class="filter-option"
          [ngClass]="{ 'selected': filters.genres === '' }"
        >
          All Genres
        </button>
        <button
          (click)="setFilter('genres', '4')"
          class="filter-option"
          [ngClass]="{ 'selected': filters.genres === '4' }"
        >
          Action
        </button>
        <button
          (click)="setFilter('genres', '51')"
          class="filter-option"
          [ngClass]="{ 'selected': filters.genres === '51' }"
        >
          Indie
        </button>
        <button
          (click)="setFilter('genres', '3')"
          class="filter-option"
          [ngClass]="{ 'selected': filters.genres === '3' }"
        >
          Adventure
        </button>
        <!-- Additional Genres -->
        <button
          (click)="setFilter('genres', '5')"
          class="filter-option"
          [ngClass]="{ 'selected': filters.genres === '5' }"
        >
          RPG
        </button>
        <button
          (click)="setFilter('genres', '2')"
          class="filter-option"
          [ngClass]="{ 'selected': filters.genres === '2' }"
        >
          Shooter
        </button>
        <button
          (click)="setFilter('genres', '7')"
          class="filter-option"
          [ngClass]="{ 'selected': filters.genres === '7' }"
        >
          Puzzle
        </button>
      </div>

      <div class="filter-group">
        <h4>Platforms</h4>
        <button
          (click)="setFilter('platforms', '')"
          class="filter-option"
          [ngClass]="{ 'selected': filters.platforms === '' }"
        >
          All Platforms
        </button>
        <button
          (click)="setFilter('platforms', '4')"
          class="filter-option"
          [ngClass]="{ 'selected': filters.platforms === '4' }"
        >
          PC
        </button>
        <button
          (click)="setFilter('platforms', '187')"
          class="filter-option"
          [ngClass]="{ 'selected': filters.platforms === '187' }"
        >
          PlayStation 5
        </button>
        <!-- Additional Platforms -->
        <button
          (click)="setFilter('platforms', '18')"
          class="filter-option"
          [ngClass]="{ 'selected': filters.platforms === '18' }"
        >
          PlayStation 4
        </button>
        <button
          (click)="setFilter('platforms', '1')"
          class="filter-option"
          [ngClass]="{ 'selected': filters.platforms === '1' }"
        >
          Xbox One
        </button>
        <button
          (click)="setFilter('platforms', '7')"
          class="filter-option"
          [ngClass]="{ 'selected': filters.platforms === '7' }"
        >
          Nintendo Switch
        </button>
      </div>

      <div class="filter-group">
        <h4>Ordering</h4>
        <button
          (click)="setFilter('ordering', '')"
          class="filter-option"
          [ngClass]="{ 'selected': filters.ordering === '' }"
        >
          Default Ordering
        </button>
        <button
          (click)="setFilter('ordering', 'name')"
          class="filter-option"
          [ngClass]="{ 'selected': filters.ordering === 'name' }"
        >
          Name
        </button>
        <button
          (click)="setFilter('ordering', '-released')"
          class="filter-option"
          [ngClass]="{ 'selected': filters.ordering === '-released' }"
        >
          Released (Newest)
        </button>
        <!-- Additional Ordering Options -->
        <button
          (click)="setFilter('ordering', 'released')"
          class="filter-option"
          [ngClass]="{ 'selected': filters.ordering === 'released' }"
        >
          Released (Oldest)
        </button>
        <button
          (click)="setFilter('ordering', '-rating')"
          class="filter-option"
          [ngClass]="{ 'selected': filters.ordering === '-rating' }"
        >
          Rating (Highest)
        </button>
        <button
          (click)="setFilter('ordering', 'rating')"
          class="filter-option"
          [ngClass]="{ 'selected': filters.ordering === 'rating' }"
        >
          Rating (Lowest)
        </button>
      </div>

      <button (click)="applyFilters()" class="btn btn-primary apply-filters-btn">Apply Filters</button>
      <button (click)="clearFilters()" class="btn btn-secondary clear-filters-btn">Clear Filters</button>
    </div>

    <!-- Game Cards -->
    <div class="game-cards">
      <div class="row justify-content-center">
        <div class="col-sm-12 col-md-6 col-lg-4 mb-4" *ngFor="let game of games">
          <div class="card h-100 fixed-card" (click)="goToGameDetails(game.id)">
            <img [src]="game.background_image" class="card-img-top fixed-image" alt="{{ game.name }}" />
            <div class="card-body">
              <h5 class="card-title">{{ game.name }}</h5>
              <p class="card-text">{{ game.released }}</p>
              <button (click)="addToFavorites(game); $event.stopPropagation();" class="btn btn-outline-primary">Add to Favorites</button>
              <button (click)="goToAchievements(game.id); $event.stopPropagation();" class="btn btn-outline-secondary mt-2">View Achievements</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Pagination -->
      <div class="pagination">
        <nav aria-label="Page navigation example">
          <ul class="pagination custom-pagination">
            <li class="page-item" [class.disabled]="currentPage === 1">
              <a class="page-link" (click)="goToFirstPage()">First</a>
            </li>
            <li class="page-item" [class.disabled]="currentPage === 1">
              <a class="page-link" (click)="goToPreviousPage()">Previous</a>
            </li>
            <li class="page-item" [class.disabled]="currentPage === totalPages">
              <a class="page-link" (click)="goToNextPage()">Next</a>
            </li>
            <li class="page-item" [class.disabled]="currentPage === totalPages">
              <a class="page-link" (click)="goToLastPage()">Last</a>
            </li>
          </ul>
        </nav>
      </div>
    </div>
  </div>
</ion-content>
